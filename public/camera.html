<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GearTrack — Mobile Camera Scanner</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css?v=6">
  
  <!-- Offline WASM Scanner -->
  <script src="libs/zxing-wasm/index.js?v=4"></script>
  
  <style>
    body {
      background: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .mobile-header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .portal-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .portal-status-pill.offline {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .viewfinder-full {
      flex: 1;
      position: relative;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #mobileReader {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #mobileReader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .scan-guide-box {
      position: relative;
      width: 80%;
      height: 50%;
      border: 2px dashed rgba(59, 130, 246, 0.8);
      border-radius: 18px;
      box-shadow: inset 0 0 30px rgba(59, 130, 246, 0.3), 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-laser-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, transparent);
      box-shadow: 0 0 14px #3b82f6;
      animation: laserSweep 2s infinite ease-in-out;
    }

    @keyframes laserSweep {
      0% { top: 10%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { top: 90%; opacity: 0; }
    }

    .mobile-bottom-bar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 0.85rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .last-scanned-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }

    .tool-controls {
      display: flex;
      gap: 0.5rem;
    }

    .shutter-btn-label {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #ffffff;
      padding: 0.85rem 1.25rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.02rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .shutter-btn-label:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Top Status Header -->
  <header class="mobile-header">
    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <img src="logo.png" alt="Logo" style="height: 32px; width: auto; object-fit: contain;">
      <strong style="font-size: 1rem; letter-spacing: -0.01em;">GearTrack Remote</strong>
    </div>

    <div class="portal-status-pill" id="portalStatusPill">
      <span class="sync-dot" id="wsStatusDot" style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
      <span id="wsStatusText">Live to Laptop</span>
    </div>
  </header>

  <!-- Fullscreen Camera Viewfinder -->
  <div class="viewfinder-full">
    <div id="mobileReader"></div>
    <div class="scan-guide-box">
      <div class="scan-laser-line"></div>
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <footer class="mobile-bottom-bar">
    
    <!-- Last Sent Confirmation -->
    <div class="recent-scan-banner" id="lastSentBanner">
      <div style="display: flex; align-items: center; gap: 0.6rem; overflow: hidden;">
        <span id="lastSentIcon" style="display: inline-flex; align-items: center; justify-content: center; color: #60a5fa;">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </span>
        <div style="overflow: hidden;">
          <div style="font-size: 0.7rem; color: #93c5fd; text-transform: uppercase; font-weight: 700;" id="lastSentSub">Scanner Ready</div>
          <div style="font-family: monospace; font-weight: 700; font-size: 0.95rem; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="lastSentText">Point at Barcode or QR Code</div>
        </div>
      </div>
      <div class="tool-controls">
        <button id="btnTorch" class="btn btn-sm" style="background: rgba(255,255,255,0.12); font-size: 0.8rem; border-radius: 8px; display: inline-flex; align-items: center; gap: 0.35rem;">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Light</span>
        </button>
        <button id="btnZoom" class="btn btn-sm" style="background: rgba(255,255,255,0.12); font-size: 0.8rem; border-radius: 8px; display: inline-flex; align-items: center; gap: 0.35rem;">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
          <span>2x</span>
        </button>
      </div>
    </div>

    <!-- Primary Camera Shutter / Macro Photo Input -->
    <label class="shutter-btn-label">
      <svg class="icon icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <span>Tap to Snap High-Res Frame</span>
      <input type="file" id="mobileShutterInput" accept="image/*" capture="environment" style="display: none;">
    </label>

  </footer>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      'use strict';

      let ws = null;
      let mobileMediaStream = null;
      let lastScannedCode = null;
      let lastScanTime = 0;
      let zoomLevel = 1.0;
      let torchEnabled = false;

      // Audio & Vibration Synthesizer
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function beepSuccess() {
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        } catch (e) {}
        if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
      }

      function showToast(msg, type = 'info') {
        const c = document.getElementById('toastContainer');
        if (!c) return;
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
      }

      // Initialize WebSocket connection to Laptop
      function connectWS() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          document.getElementById('wsStatusDot').style.background = '#10b981';
          document.getElementById('wsStatusDot').style.boxShadow = '0 0 8px #10b981';
          document.getElementById('wsStatusText').textContent = 'Live to Laptop';
          document.getElementById('portalStatusPill').className = 'portal-status-pill';
        };

        ws.onclose = () => {
          document.getElementById('wsStatusDot').style.background = '#ef4444';
          document.getElementById('wsStatusDot').style.boxShadow = '0 0 8px #ef4444';
          document.getElementById('wsStatusText').textContent = 'Connecting...';
          document.getElementById('portalStatusPill').className = 'portal-status-pill offline';
          setTimeout(connectWS, 2000);
        };

        ws.onerror = () => ws.close();
      }

      // Initialize ZXing-WASM configuration for mobile companion
      if (window.ZXingWASM) {
        try {
          window.ZXingWASM.setZXingModuleOverrides({
            locateFile: (file, prefix) => 'libs/zxing-wasm/' + file
          });
        } catch (e) {
          console.warn('ZXingWASM mobile config notice:', e);
        }
      }

      // --- HIGH-RESOLUTION WASM 360° FRAME SCANNER ---
      let wasmMobileScanInterval = null;
      const wasmMobileCanvas = document.createElement('canvas');
      const wasmMobileCtx = wasmMobileCanvas.getContext('2d', { willReadFrequently: true });
      let isScanningMobileFrame = false;

      function startMobileWasmScanner() {
        if (wasmMobileScanInterval) clearInterval(wasmMobileScanInterval);
        wasmMobileScanInterval = setInterval(async () => {
          if (!window.ZXingWASM || isScanningMobileFrame) return;
          const video = document.querySelector('#mobileReader video');
          if (!video || video.readyState < 2 || video.paused) return;

          isScanningMobileFrame = true;
          try {
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;

            // Target high-definition processing frame for maximum 1D bar precision
            const targetW = Math.min(vw, 1280);
            const targetH = Math.round(targetW * (vh / vw)) || 720;

            if (wasmMobileCanvas.width !== targetW || wasmMobileCanvas.height !== targetH) {
              wasmMobileCanvas.width = targetW;
              wasmMobileCanvas.height = targetH;
            }

            wasmMobileCtx.drawImage(video, 0, 0, targetW, targetH);
            const imgData = wasmMobileCtx.getImageData(0, 0, targetW, targetH);

            const results = await window.ZXingWASM.readBarcodesFromImageData(imgData, {
              tryHarder: true,
              tryRotate: true,   // Full 360-degree rotation support (0°, 90°, 180°, 270°)
              tryInvert: true,   // Inverted / light-on-dark codes
              tryDownscale: true
            });

            if (results && results.length > 0) {
              const match = results[0];
              if (match.text) {
                handleMobileCandidate(match.text, match.format || 'ZXingWASM');
              }
            }
          } catch (err) {
            // Frame analysis silent catch
          } finally {
            isScanningMobileFrame = false;
          }
        }, 90);
      }

      // --- MULTI-FRAME CONSENSUS FILTER ---
      function is2DFormat(format) {
        const f = (format || '').toUpperCase();
        return f.includes('QR') || f.includes('MATRIX') || f.includes('AZTEC') || f.includes('PDF');
      }

      const consensusFilter = {
        code: null,
        format: null,
        count: 0,
        lastTime: 0
      };

      async function handleMobileCandidate(rawCode, formatName) {
        const clean = (rawCode || '').trim();
        if (!clean) return;

        const now = Date.now();
        if (clean === lastScannedCode && (now - lastScanTime) < 1800) return;

        // 2D codes (QR, Data Matrix) have Reed-Solomon polynomial math with 0% false reads -> immediate commit
        if (is2DFormat(formatName)) {
          sendCodeToLaptop(clean, formatName);
          return;
        }

        // 1D barcodes: require 2 consecutive frames agreeing on identical digits within 650ms
        if (consensusFilter.code === clean && (now - consensusFilter.lastTime) < 650) {
          consensusFilter.count++;
          consensusFilter.lastTime = now;
          if (consensusFilter.count >= 2) {
            consensusFilter.code = null;
            consensusFilter.count = 0;
            sendCodeToLaptop(clean, formatName);
          }
        } else {
          consensusFilter.code = clean;
          consensusFilter.format = formatName;
          consensusFilter.count = 1;
          consensusFilter.lastTime = now;
        }
      }

      // Send scanned code to Laptop Portal
      async function sendCodeToLaptop(code, format = 'Code') {
        const now = Date.now();
        if (code === lastScannedCode && (now - lastScanTime) < 1800) return;
        lastScannedCode = code;
        lastScanTime = now;

        beepSuccess();

        // Update UI
        document.getElementById('lastSentIcon').innerHTML = `<svg class="icon icon-sm" style="color: #34d399;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
        document.getElementById('lastSentSub').textContent = `Transmitted (${format})`;
        document.getElementById('lastSentText').textContent = code;

        // 1. Send via WebSocket if open
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: 'scan', code, format }));
        }

        // 2. Also send via HTTP endpoint for guaranteed delivery
        try {
          await fetch('/api/scan/remote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, format })
          });
        } catch (e) {
          console.error('Remote HTTP post error:', e);
        }

        showToast(`Sent "${code}" to Laptop!`, 'success');
      }

      // Start Native Camera Stream + ZXingWASM Engine
      async function initMobileCamera() {
        const readerElement = document.getElementById('mobileReader');
        if (!readerElement) return;

        try {
          if (mobileMediaStream) {
            mobileMediaStream.getTracks().forEach(t => t.stop());
            mobileMediaStream = null;
          }

          const constraints = {
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920, min: 1280 },
              height: { ideal: 1080, min: 720 }
            },
            audio: false
          };

          mobileMediaStream = await navigator.mediaDevices.getUserMedia(constraints);

          readerElement.innerHTML = '';
          const video = document.createElement('video');
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;
          video.srcObject = mobileMediaStream;
          video.style.width = '100%';
          video.style.height = '100%';
          video.style.objectFit = 'cover';
          readerElement.appendChild(video);

          await video.play().catch(() => {});

          startMobileWasmScanner();
        } catch (err) {
          console.warn('Live stream start error:', err);
          showToast('Camera access blocked or unavailable: ' + err.message, 'error');
        }
      }

      // Handle Native Macro Photo Shutter
      async function handleShutterPhoto(file) {
        if (!file) return;
        document.getElementById('lastSentSub').textContent = 'Analyzing Photo...';
        document.getElementById('lastSentText').textContent = 'Decoding Barcode / QR...';

        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64 = e.target.result;
          try {
            const res = await fetch('/api/scan/image', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ imageBase64: base64 })
            });
            const data = await res.json();
            if (data.found && data.code) {
              sendCodeToLaptop(data.code, data.format || 'Macro Photo');
            } else {
              document.getElementById('lastSentSub').textContent = 'Scan Unsuccessful';
              document.getElementById('lastSentText').textContent = 'No code recognized in photo';
              showToast('No barcode/QR recognized. Try holding closer with good lighting.', 'error');
            }
          } catch (err) {
            showToast('Scan error: ' + err.message, 'error');
          }
        };
        reader.readAsDataURL(file);
      }

      // Torch Toggle
      async function toggleTorch() {
        if (!mobileMediaStream) return;
        const track = mobileMediaStream.getVideoTracks()[0];
        if (!track) return;
        try {
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.torch) {
            torchEnabled = !torchEnabled;
            await track.applyConstraints({ advanced: [{ torch: torchEnabled }] });
            const btn = document.getElementById('btnTorch');
            if (btn) {
              btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> <span>${torchEnabled ? 'ON' : 'Light'}</span>`;
            }
            showToast(torchEnabled ? 'Flashlight ON' : 'Flashlight OFF', 'info');
          } else {
            showToast('Flashlight not supported on this device camera', 'info');
          }
        } catch (e) {
          showToast('Could not toggle flashlight', 'error');
        }
      }

      // Digital Zoom toggle
      async function cycleZoom() {
        if (zoomLevel === 1.0) {
          zoomLevel = 2.0;
        } else if (zoomLevel === 2.0) {
          zoomLevel = 3.0;
        } else {
          zoomLevel = 1.0;
        }

        const btn = document.getElementById('btnZoom');
        if (btn) {
          btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg> <span>${zoomLevel}x</span>`;
        }

        // Apply hardware zoom if supported by mobile lens
        if (mobileMediaStream) {
          const track = mobileMediaStream.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            const caps = track.getCapabilities();
            if (caps.zoom) {
              try {
                const target = Math.min(Math.max(zoomLevel, caps.zoom.min || 1), caps.zoom.max || 3);
                await track.applyConstraints({ advanced: [{ zoom: target }] });
              } catch (e) {}
            }
          }
        }

        const video = document.querySelector('#mobileReader video');
        if (video) {
          video.style.transform = zoomLevel > 1 ? `scale(${zoomLevel})` : 'scale(1.0)';
          video.style.transformOrigin = 'center center';
        }
      }

      // Event Listeners
      document.getElementById('mobileShutterInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleShutterPhoto(e.target.files[0]);
          e.target.value = '';
        }
      });

      document.getElementById('btnZoom').addEventListener('click', cycleZoom);
      document.getElementById('btnTorch').addEventListener('click', toggleTorch);

      // Initialize
      window.addEventListener('DOMContentLoaded', () => {
        connectWS();
        initMobileCamera();
      });

    })();
  </script>
</body>
</html>
